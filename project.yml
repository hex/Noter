name: Noter
options:
  bundleIdPrefix: com.hexul
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  swift-markdown:
    url: https://github.com/apple/swift-markdown.git
    from: "0.4.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Noter:
    type: application
    platform: macOS
    sources:
      - path: Sources/Noter
      - path: Assets.xcassets
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Noter
        CFBundleDisplayName: Noter
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "hexul"
        SUFeedURL: https://raw.githubusercontent.com/hex/Noter/main/appcast.xml
        SUPublicEDKey: AvfZk+goO2PNLNs69+o7SfePAMl/w5PLLO+TZ69IKVI=
    entitlements:
      path: Noter.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexul.noter
        MARKETING_VERSION: "2026.9.0"
        CURRENT_PROJECT_VERSION: "2026091401"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "7G4UQW35EL"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
